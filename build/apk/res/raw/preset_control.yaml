openapi: 3.0.1
info:
  title: Preset Control API
  description: API For controlling the presets on Blackmagic Design products
  version: 1.2.0
servers:
- url: /control/api/v1
paths:
  /presets:
    get:
      summary: Get the list of the presets on the camera
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/presetList'
    post:
      summary: Send a preset file to the camera
      description: Uploads a preset file with .bmcpreset extension to the camera
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: The preset file must be sent with a Content-Disposition header containing the filename
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postPresetResponse'
        400:
          description: Bad request - missing Content-Disposition header or filename
  /presets/active:
    get:
      summary: Get the currently active preset on the camera
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activePreset'
    put:
      summary: Set the active preset on the camera
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/activePreset'
      responses:
        204:
          description: No Content
        404:
          description: Preset file not found
  /presets/{presetName}:
    parameters:
      - $ref: '#/components/parameters/presetName'
    get:
      summary: Download the preset file
      responses:
        200:
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: File does not exist
    put:
      summary: Save current camera state as a preset
      description: Creates a new preset or updates an existing preset with the current camera state
      responses:
        204:
          description: No Content
    delete:
      summary: Delete a preset from the camera
      responses:
        204:
          description: No Content
        404:
          description: Preset file not found

components:
  parameters:
    presetName:
      in: path
      name: presetName
      required: true
      description: Name of the preset file (must end with .bmcpreset). Obtainable from GET /presets.
      schema:
        type: string
        pattern: '^[^\x00-\x1F"/:*?<>|]+\.bmcpreset$'
      x-bmd-list-source:
        from: /presets
        pointer: /presets
        extract: items

  schemas:
    presetList:
      type: object
      properties:
        presets:
          type: array
          items:
            type: string
          description: List of the presets on the camera (.bmcpreset files)
    postPresetResponse:
      type: object
      properties:
        presetAdded:
          type: string
          description: Name of the preset uploaded (without .bmcpreset extension)
    activePreset:
      type: object
      properties:
        preset:
          type: string
          description: Name of the active preset (with .bmcpreset extension, or 'default')
